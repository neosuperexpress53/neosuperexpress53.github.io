        <table>
            <tr>
                <td><a href="index.html"><img src="media/once_upon_online_logo_small.png" alt="Once Upon Online Logo"></a></td>
                <td>Search...</td>
                <td>
                    <a href="bookmark.html"><img src="media/bookmark.png" alt="Bookmark Page"></a>
                    <a href="signup.html"><img src="media/profile.png" alt="Profile Page"></a>
                    <a href="basket.html"><img src="media/basket.png" alt="Basket Page"></a>    
                </td>
            </tr>
        </table>
        <table>
            <tr>
                <td><a href="index.html">Home</a></td>
                <td><a href="products/mystery.html">Mystery</a></td>

            </tr>
        </table>
    </header>

    
    <main>
        <form action="profile.html" method="post"> 
            <fieldset> 
                <legend><h2>Sign-Up</h2></legend>

                <table>
                    <tr>
                        <td><label for="fName">First Name:</label></td>
                        <td><input type="text" id="fName" name="fName" required autofocus></td>
                    </tr>
                    <tr>
                        <td><label for="lName">Last Name:</label></td>
                        <td><input type="text" id="lName" name="lName" required></td>
                    </tr>
                    <tr>
                        <td><label for="username">Username:</label></td>
                        <td><input type="text" id="username" name="username" required></td>
                    </tr>
                    <tr>
                        <td><label for="email">Email:</label></td>
                        <td><input type="email" id="email" name="email" placeholder="example@gmail.com" required></td>
                    </tr>
                    <tr>
                        <td><label for="phone">Phone:</label></td>
                        <td><input type="text" id="phone" name="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required></td>
                    </tr>
                    <tr>
                        <td>Gender:</td>
                        <td id="radialMenu">
                            <input type="radio" id="female" name="gender" value="Female">
                            <label for="female">Female</label><br>
                            <input type="radio" id="male" name="gender" value="Male"> 
                            <label for="female">Male</label><br>
                            <input type="radio" id="other" name="gender" value="Other">
                            <label for="female">Other</label>
                        </td>
                    </tr>
                </table>

                <section id="buttonArea">
                    <input type="submit" value="Sign-Up" id="submit">
                </section>
            </fieldset>
        </form>
    </main>
    

    <footer>
        <div>
            <a href="#top" class="top">Back to top</a>
            <p class="author">Authors: Calvin Nguyen, Yanyu Chen </p>

            <img src="media/x.png" alt="X Page">
            <img src="media/instagram.png" alt="Instagram Page">
            <img src="media/youtube.png" alt="YouTube Page">
        </div>
    </footer>
</body>
</html>
